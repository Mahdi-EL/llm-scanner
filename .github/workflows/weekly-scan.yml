name: Weekly demo scan

# Runs the full attack library against the demo assistant every Monday, so
# changes to prompts, the judge or the Groq models show up as a score change.
# Needs the GROQ_API_KEY secret. A full scan makes about 2,150 Groq calls.

on:
  schedule:
    - cron: "0 9 * * 1"   # Mondays 09:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  weekly-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the full scan
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -z "$GROQ_API_KEY" ]; then
            echo "::notice::GROQ_API_KEY secret isn't set, so the weekly scan was skipped."
            exit 0
          fi
          python backend/scanner.py --target "Weekly demo audit" --output weekly_report --reports-dir results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: weekly-security-report-${{ github.run_number }}
          path: results/weekly_report.*
          retention-days: 90
          if-no-files-found: ignore
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("results/weekly_report.json")
          if p.exists():
              s = json.loads(p.read_text())["summary"]
              print(f"## Weekly demo scan: {s['security_score']}/100, grade {s['grade']}")
              print(f"| Critical | High | Medium | Low | Safe | Errors |\n|---|---|---|---|---|---|")
              print(f"| {s['critical']} | {s['high']} | {s['medium']} | {s['low']} | {s['safe']} | {s['errors']} |")
          EOF
