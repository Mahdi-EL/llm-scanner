name: Demo security scan

# Scans the built-in demo assistant (simulation mode) with the engine in this
# repo. It tests the scanner itself, not your code, so it only runs by hand.
# To scan your own AI app in CI, use the reusable action:
#   uses: Mahdi-EL/llm-scanner/.github/actions/scan@main   (see README)

on:
  workflow_dispatch:
    inputs:
      categories:
        description: Space-separated attack categories
        default: direct_override extraction social_engineering boundary_testing

permissions:
  contents: read

jobs:
  demo-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run the scanner
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python backend/scanner.py --target "Demo assistant" --output ci_report \
            --categories ${{ inputs.categories }} --reports-dir results
      - name: Summary
        if: always()
        run: |
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json, pathlib
          p = pathlib.Path("results/ci_report.json")
          if p.exists():
              s = json.loads(p.read_text())["summary"]
              print(f"## Demo scan: {s['security_score']}/100, grade {s['grade']}")
              print(f"{s['critical']} critical, {s['high']} high, {s['medium']} medium, {s['errors']} errors")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demo-security-report
          path: results/ci_report.*
          if-no-files-found: ignore
